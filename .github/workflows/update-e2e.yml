name: Verify v0.1.2 to v0.1.3 public updater
on:
  push:
    branches: ['test/app034-update-e2e-v013']
    paths: ['.github/workflows/update-e2e.yml']
permissions:
  contents: read
jobs:
  public-update:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/KomuDesk.Update.Integration/KomuDesk.Update.Integration.csproj -c Release -- --isolated-ci
