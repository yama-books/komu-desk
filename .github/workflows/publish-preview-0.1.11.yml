name: Publish verified Windows preview 0.1.11
on:
  push:
    branches: ['release/app034-preview-0.1.11']
    paths: ['.github/workflows/publish-preview-0.1.11.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-app034-preview-0.1.11
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'yama-books/komu-desk' && github.actor == 'yama-books'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: yama-books/komu-desk
      RUN_ID: '45973569999'
      EXPECTED_SHA: 'a494271fe1ddf95938899c8f7e37a48bf953d5ce'
      TAG: 'v0.1.11-preview'
      ARTIFACT: 'komu-desk-windows-x64-preview'
    steps:
      - name: Verify existing source and successful run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" | jq -e --arg sha "$EXPECTED_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"'
          gh api "repos/$GH_REPO/actions/artifacts/15186151579" | jq -e --arg name "$ARTIFACT" --argjson id "$RUN_ID" '.name == $name and .expired == false and .workflow_run.id == $id'
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
      - name: Repackage only previously verified build and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package out
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "$ARTIFACT" --dir package
          test -s package/KOMU-DESK.exe
          test -s package/KOMU-DESK.dll
          # The build consists solely of published runtime/application files.
          # No school data, credentials, database or local import files may ship.
          if find package -type f \( -iname '*.xlsx' -o -iname '*.csv' -o -iname '*.db' -o -iname '*.sqlite*' -o -iname '*.bin' -o -iname '*credentials*' -o -iname '*client_secret*' -o -iname 'data.json' \) | grep -q .; then
            echo "Unexpected data file"; exit 1
          fi
          (cd package && zip -q -r ../out/komu-desk-windows-x64-preview.zip .)
          (cd out && sha256sum komu-desk-windows-x64-preview.zip > SHA256SUMS.txt)
      - name: Publish public prerelease, not a stable release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/preview-notes.md <<'EOF'
          Windows 11 / x64 自己完結型の未署名評価版。ZIPを展開し KOMU-DESK.exe を起動してください。
          架空デモは PowerShell で .\KOMU-DESK.exe --demo。
          実機検収・実Google OAuth・通信監査・印刷検収は未完了。校務PCの利用規則に従い、まず許可された環境で架空データを試してください。名列・出欠は未実装です。担当授業一括登録・時間割簡易入力・Excel予定追加取り込み・特別時程・予定連動ルールを追加。既存データ、猫アイコン、旧版整理を維持。開発者の実OAuthクライアントは未登録・未同梱。従来の設定済みアカウントはブラウザ再認証可能。v0.1.2以降からアプリ内更新可能。自動確認は既定OFF、適用は本人確認。校務データの場所は同一。特別時程等を保存すると形式2に移行し、旧版は安全のため読み込みを拒否します。利用前のバックアップを推奨。未署名・実配布版間の更新検収は未完了。
          Google連携は任意の読み取り専用・手動同期のみ。他機能はローカル処理。正式配布版ではありません。
          Source: a494271fe1ddf95938899c8f7e37a48bf953d5ce
          Verified CI: https://github.com/yama-books/komu-desk/actions/runs/45973569999
          EOF
          gh release create "$TAG" out/komu-desk-windows-x64-preview.zip out/SHA256SUMS.txt --repo "$GH_REPO" --target "$EXPECTED_SHA" --title "KOMU DESK v0.1.11-preview (Windows x64)" --prerelease --notes-file /tmp/preview-notes.md
          gh release view "$TAG" --repo "$GH_REPO" --json url,isPrerelease,assets
