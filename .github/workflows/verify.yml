name: Verify local desktop
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/KomuDesk.Core.Tests/KomuDesk.Core.Tests.csproj -c Release
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/KomuDesk.Desktop/KomuDesk.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path publish/KOMU-DESK.exe)) { throw "Missing executable" }
          Get-FileHash publish/KOMU-DESK.exe -Algorithm SHA256
      - name: Launch and render offline fictional demo
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/KOMU-DESK.exe) -ArgumentList @("--smoke", "demo-preview.png") -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); throw "WPF smoke timed out" }
          if ($p.ExitCode -ne 0 -or !(Test-Path demo-preview.png)) { throw "WPF smoke failed" }
      - name: Render settings bento menu with embedded icons
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/KOMU-DESK.exe) -ArgumentList @("--smoke", "menu-preview.png", "--menu-preview") -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); throw "Bento smoke timed out" }
          if ($p.ExitCode -ne 0 -or !(Test-Path menu-preview.png)) { throw "Bento smoke failed" }
      - name: Verify all ten tray resources and render picker
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/KOMU-DESK.exe) -ArgumentList @("--smoke", "tray-preview.png", "--tray-preview") -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); throw "Tray smoke timed out" }
          if ($p.ExitCode -ne 0 -or !(Test-Path tray-preview.png)) { throw "Tray smoke failed" }
      - name: Exercise retention on isolated fictional package directories
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/KOMU-DESK.exe) -ArgumentList @("--smoke", "retention-preview.png", "--retention-test") -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); throw "Retention test timed out" }
          if ($p.ExitCode -ne 0 -or !(Test-Path retention-preview.png)) { throw "Retention test failed" }
      - name: Render management pages and all calendar modes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui3-preview | Out-Null
          $p = Start-Process -FilePath (Resolve-Path publish/KOMU-DESK.exe) -ArgumentList @("--smoke","ui3-preview/interactions.png","--page=calendar","--ui3-interaction") -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); throw "UI3 interaction timed out" }
          if ($p.ExitCode -ne 0 -or !(Test-Path "ui3-preview/interactions.png")) { throw "UI3 interaction failed" }
          $cases = @('home','calendar','timetable','counts','tasks','reports','google','settings','updates')
          foreach ($page in $cases) {
            $p = Start-Process -FilePath (Resolve-Path publish/KOMU-DESK.exe) -ArgumentList @("--smoke","ui3-preview/$page.png","--page=$page") -PassThru
            if (!$p.WaitForExit(30000)) { $p.Kill(); throw "UI3 $page timed out" }
            if ($p.ExitCode -ne 0 -or !(Test-Path "ui3-preview/$page.png")) { throw "UI3 $page failed" }
          }
          foreach ($mode in @(@("week","週"),@("day","日"),@("list","一覧"))) {
            $file = "ui3-preview/calendar-$($mode[0]).png"
            $p = Start-Process -FilePath (Resolve-Path publish/KOMU-DESK.exe) -ArgumentList @("--smoke",$file,"--page=calendar","--mode=$($mode[1])") -PassThru
            if (!$p.WaitForExit(30000)) { $p.Kill(); throw "UI3 calendar timed out" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $file)) { throw "UI3 calendar failed" }
          }
      - name: Verify editor validation and search, render narrow layout and forms
        shell: pwsh
        run: |
          foreach ($case in @(@("form-events","--event-form"),@("form-tasks","--task-form"),@("form-interactions","--form-interaction"),@("narrow-calendar","--page=calendar","--narrow"),@("narrow-reports","--page=reports","--narrow"))) {
            $file = "ui3-preview/$($case[0]).png"
            $argsForApp = @("--smoke",$file) + $case[1..($case.Length-1)]
            $p = Start-Process -FilePath (Resolve-Path publish/KOMU-DESK.exe) -ArgumentList $argsForApp -PassThru
            if (!$p.WaitForExit(30000)) { $p.Kill(); throw "Form smoke timed out: $file" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $file)) { throw "Form smoke failed: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: komu-desk-ui3-images
          path: ui3-preview/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: komu-desk-tray-picker-image
          path: tray-preview.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: komu-desk-bento-menu-image
          path: menu-preview.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: komu-desk-fictional-demo-image
          path: demo-preview.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: komu-desk-windows-x64-preview
          path: publish/
          retention-days: 14
