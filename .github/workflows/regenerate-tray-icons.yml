name: Regenerate approved tray icons
on:
  push:
    branches: ['feature/app034-retention-icon-quality']
    paths: ['.github/workflows/regenerate-tray-icons.yml']
permissions:
  contents: write
jobs:
  assets:
    if: github.repository == 'yama-books/komu-desk' && github.actor == 'yama-books'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app034-retention-icon-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python scripts/generate_tray_icons.py
      - name: Commit generated assets only
        run: |
          git add src/KomuDesk.Desktop/Assets/Tray/cat-*.png src/KomuDesk.Desktop/Assets/Tray/cat-*.ico
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: generate smooth multi-resolution light and dark tray icons'
          git push origin HEAD:feature/app034-retention-icon-quality

# Tiny icons need not contain fully opaque pixels.
